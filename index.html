<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zdrowa dieta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script> <!-- Load Config First -->
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #050505;
            --text-secondary: #65676b;
            --accent-blue: #1877f2;
            --border-color: #ced0d4;
            --hover-bg: #f2f2f2;
            --group-vegan: #4caf50;
            --group-meat: #d32f2f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            /*border-top: 5px solid #ccc;*/ /* Dynamic color via JS */
        }

        /* Header */
        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-image: url('https://ui-avatars.com/api/?name=Mięso+Maniacy&background=random');
            background-size: cover;
        }

        .user-info h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .user-info span {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-caption {
            padding: 4px 16px 12px;
            font-size: 15px;
        }

        /* Image */
        .post-image {
            width: 100%;
            height: 300px;
            display: flex;
            position: relative;
            background-color: #000;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            background-size: cover;
            background-position: center;
        }

        .panel.vegan {
            background-image: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
        }

        .panel.meat {
            background-image: url('https://images.unsplash.com/photo-1600891964092-4316c288032e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
        }

        .panel::before {
            content: attr(data-icon);
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .panel.has-error {
            background: #333;
            opacity: 0.8;
        }

        .panel.has-error::before {
            opacity: 1;
        }

        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.8rem;
            z-index: 10;
            border: 3px solid white;
        }

        /* Actions */
        .action-bar {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            width: 30%;
            border-radius: 4px;
        }

        .action-btn:hover {
            background-color: var(--hover-bg);
        }

        /* Comments */
        .comments-section {
            padding: 10px;
            background-color: #fff;
        }

        .comment-list {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            max-height: 500px;
            overflow-y: auto;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Indentation */
        .comment-item.reply-level-1 {
            margin-left: 40px;
            border-left: 2px solid #e4e6eb;
            padding-left: 10px;
        }

        .comment-item.reply-level-2 {
            margin-left: 80px;
            border-left: 2px solid #e4e6eb;
            padding-left: 10px;
        }

        .comment-item.reply-level-3 {
            margin-left: 120px;
            border-left: 2px solid #e4e6eb;
            padding-left: 10px;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .comment-bubble {
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 18px;
            flex-grow: 1;
        }

        .comment-author {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 2px;
            display: block;
        }

        .comment-text {
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .reply-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
        }

        .reply-btn:hover {
            text-decoration: underline;
        }

        .reply-input-container {
            display: none;
            margin-top: 8px;
            margin-left: 42px;
            gap: 8px;
        }

        .reply-input-container.active {
            display: flex;
        }

        .reply-input-container input {
            flex-grow: 1;
            padding: 8px 12px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
        }

        .reply-submit-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Input Area */
        .input-area {
            border-top: 1px solid var(--border-color);
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .name-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .name-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            width: 60px;
        }

        #usernameInput {
            flex-grow: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-size: 14px;
            outline: none;
        }

        #usernameInput:focus {
            background-color: #fff;
            border-color: var(--accent-blue);
        }

        /* Comment textarea + submit button */
        .comment-input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end; /* aligns button to bottom of textarea */
        }

        #commentInput {
            flex-grow: 1;
            width: 100%;
            min-height: 80px; /* taller box */
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-size: 15px;
            line-height: 1.4;
            outline: none;
            box-sizing: border-box;
            resize: vertical; /* user can drag taller if desired */
            font-family: inherit;
        }

        #commentInput:focus {
            background-color: #fff;
            border-color: var(--accent-blue);
        }

        .post-btn {
            background: linear-gradient(to bottom, #1877f2, #166fe5);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            height: 44px; /* matches a comfortable tap target */
            flex-shrink: 0;
        }

        .post-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Quick Options as inline chips */
        .quick-options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .quick-options-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            width: 100%; /* label sits on its own line above chips */
        }

        .quick-chip {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            white-space: normal;
            line-height: 1.3;
            text-align: left;
        }

        .quick-chip:hover {
            background-color: #e4e6eb;
            border-color: var(--text-secondary);
        }

        .quick-chip:empty {
            display: none;
        }

        /* Group Badge */
        .group-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="post-header">
        <div class="avatar"></div>
        <div class="user-info">
            <h3 id="pageTitle">Dieta</h3>
            <span>2 hrs · <span style="font-size:10px">🌍</span></span>
        </div>
    </div>

    <div class="post-caption" id="postCaption">
        Loading discussion...
    </div>

    <div class="post-image">
        <div class="panel vegan" data-icon="🥗">VEGE</div>
        <div class="vs-badge">VS</div>
        <div class="panel meat" data-icon="🥩">MIĘSO</div>
    </div>

    <div class="comments-section">
        <ul class="comment-list" id="commentList"></ul>

        <div class="input-area">
            <!-- Name -->
            <div class="name-input-row">
                <label class="name-label" for="usernameInput">Nick</label>
                <input type="text" id="usernameInput" placeholder="Wpisz swój nick...">
            </div>

            <!-- Comment textarea + Submit -->
            <div class="comment-input-row">
                <textarea id="commentInput" placeholder="Napisz coś..."></textarea>
                <button class="post-btn" id="postBtn">Wyślij</button>
            </div>

            <!-- Quick options as chips -->
            <div class="quick-options-row" id="quickOptionsRow">
                <span class="quick-options-label">⚡ Szybka odpowiedź</span>
                <!-- Chips injected via JS -->
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIG & INIT ---
    if (typeof SUPABASE_CONFIG === 'undefined') {
        alert("Config error");
    }
    const _supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);

    // Determine Group from URL
    const urlParams = new URLSearchParams(window.location.search);
    let CURRENT_GROUP = urlParams.get('group');

    // Default to 'vegan' if missing, or handle error
    if (!CURRENT_GROUP || !['vegan', 'meat'].includes(CURRENT_GROUP)) {
        CURRENT_GROUP = 'vegan'; // Default fallback
        // Optional: Redirect or show error. For now, we default.
    }

    // variant controls which fixed comments are visible
    let CURRENT_VARIANT = urlParams.get('variant');
    if (!CURRENT_VARIANT || !['full', 'top'].includes(CURRENT_VARIANT)) {
        CURRENT_VARIANT = 'full'; // default: see everything
    }

    // Configuration per Group
    const GROUP_CONFIG = {
        'vegan': {
            color: '#4caf50',
            pageTitle: 'Wege-Maniacy',
            avatar: 'https://ui-avatars.com/api/?name=Wege-Maniacy&background=4caf50&color=fff&bold=true&size=128',
            caption: 'W parlamencie europejskim znowu debata klimatyczna. Temat ograniczania produkcji i spożycia mięsa wraca jak bumerang. Co o tym myślicie? Piszcie w komentarzach 👇'
        },
        'meat': {
            color: '#d32f2f',
            pageTitle: 'Mięso-Maniacy',
            avatar: 'https://ui-avatars.com/api/?name=Mięso-Maniacy&background=4caf50&color=fff&bold=true&size=128',
            caption: 'W parlamencie europejskim znowu debata klimatyczna. Temat ograniczania produkcji i spożycia mięsa wraca jak bumerang. Co o tym myślicie? Piszcie w komentarzach 👇'
        }
    };

    const CONFIG = GROUP_CONFIG[CURRENT_GROUP];

    // Apply Theme
    document.getElementById('mainContainer').style.borderTopColor = CONFIG.color;
    //document.getElementById('groupBadge').textContent = CURRENT_GROUP;
    //document.getElementById('groupBadge').style.backgroundColor = CONFIG.color;
    document.getElementById('pageTitle').innerHTML = CONFIG.pageTitle;
    document.getElementById('postCaption').innerHTML = CONFIG.caption;
    // Group avatar
    document.querySelector('.avatar').style.backgroundImage = `url('${CONFIG.avatar}')`;

    // Populate Quick Options

    // --- LOAD QUICK REPLIES FROM SUPABASE ---
    async function loadQuickReplies() {
        // Clear existing chips but keep the label (first child)
        const existingChips = quickOptionsRow.querySelectorAll('.quick-chip');
        existingChips.forEach(chip => chip.remove());

        const {data, error} = await _supabase
            .from('quick_replies')
            .select('*')
            .eq('group_tag', CURRENT_GROUP)
            .eq('is_active', true)
            .order('sort_order', {ascending: true});

        if (error) {
            console.error('Quick replies error:', error);
            return;
        }

        if (!data || data.length === 0) return;

        // Fisher-Yates shuffle so the order differs on each load
        for (let i = data.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [data[i], data[j]] = [data[j], data[i]];
        }

        data.forEach(reply => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'quick-chip';
            btn.textContent = reply.display_text;
            btn.onclick = () => {
                commentInput.value = reply.comment_text;
                commentInput.focus();
            };
            quickOptionsRow.appendChild(btn);
        });
    }

    // --- USER LOGIC ---
    function getOrCreateUserId() {
        let userId = localStorage.getItem('diet_app_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            localStorage.setItem('diet_app_user_id', userId);
        }
        return userId;
    }

    function loadSavedUsername() {
        const savedName = localStorage.getItem('diet_app_username');
        if (savedName) document.getElementById('usernameInput').value = savedName;
    }

    function saveUsername(name) {
        localStorage.setItem('diet_app_username', name);
    }

    const CURRENT_USER_ID = getOrCreateUserId();
    document.addEventListener('DOMContentLoaded', () => {
        loadSavedUsername();
        loadComments();
        loadQuickReplies();
    });

    // --- DOM ELEMENTS ---
    const usernameInput = document.getElementById('usernameInput');
    const commentInput = document.getElementById('commentInput');
    const postBtn = document.getElementById('postBtn');
    const commentList = document.getElementById('commentList');
    const quickOptionsRow = document.getElementById('quickOptionsRow');


    // --- IMAGE FALLBACK ---
    document.querySelectorAll('.panel').forEach(panel => {
        const bgUrl = getComputedStyle(panel).backgroundImage.slice(4, -1).replace(/"/g, "");
        const img = new Image();
        img.src = bgUrl;
        img.onerror = () => panel.classList.add('has-error');
    });

    // --- UI INTERACTIONS ---


    // --- RENDER FUNCTION ---
    function createCommentElement(comment, isFixed) {
        const li = document.createElement('li');
        li.className = `comment-item reply-level-${comment.reply_level || 0}`;
        li.id = `comment-${comment.id}`;

        let displayName = comment.author || "Guest";
        if (!displayName.trim()) displayName = isFixed ? "Anonymous" : "Guest";

        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=random`;
        const canReply = (comment.reply_level < 3);
        const replyButtonHtml = canReply ? `<button class="reply-btn" onclick="toggleReplyInput(${comment.id})">Reply</button>` : '';

        li.innerHTML = `
            <img src="${avatarUrl}" class="comment-avatar" alt="${displayName}">
            <div class="comment-bubble">
                <span class="comment-author">${escapeHtml(displayName)} ${replyButtonHtml}</span>
                <div class="comment-text">${escapeHtml(comment.content)}</div>
                <div id="reply-input-${comment.id}" class="reply-input-container">
                    <input type="text" id="reply-text-${comment.id}" placeholder="Napisz odpowiedź...">
                    <button class="reply-submit-btn" onclick="submitReply(${comment.id})">Send</button>
                </div>
            </div>
        `;
        return li;
    }

    // --- REPLY LOGIC ---
    window.toggleReplyInput = function (parentId) {
        const container = document.getElementById(`reply-input-${parentId}`);
        const input = document.getElementById(`reply-text-${parentId}`);
        if (container.classList.contains('active')) {
            container.classList.remove('active');
        } else {
            document.querySelectorAll('.reply-input-container').forEach(el => el.classList.remove('active'));
            container.classList.add('active');
            input.focus();
        }
    };

    window.submitReply = async function (parentId) {
        const textInput = document.getElementById(`reply-text-${parentId}`);
        const text = textInput.value.trim();
        const name = usernameInput.value.trim();

        if (!text) return alert("Please write a reply.");
        if (!name) return alert("Please enter your name first.");

        saveUsername(name);

        // Get parent level
        const {data: parentData} = await _supabase.from('comments').select('reply_level').eq('id', parentId).single();
        const newLevel = (parentData?.reply_level || 0) + 1;

        const newComment = {
            content: text,
            author: name,
            user_id: CURRENT_USER_ID,
            parent_id: parentId,
            reply_level: newLevel,
            group_tag: CURRENT_GROUP // IMPORTANT: Tag with current group
        };

        const {data, error} = await _supabase.from('com2').insert([newComment]).select();

        if (error) {
            alert('Failed: ' + error.message);
            return;
        }

        const newLi = createCommentElement(data[0], false);
        const parentLi = document.getElementById(`comment-${parentId}`);
        parentLi.after(newLi);

        textInput.value = '';
        document.getElementById(`reply-input-${parentId}`).classList.remove('active');
        newLi.style.backgroundColor = '#e7f3ff';
        newLi.scrollIntoView({behavior: 'smooth', block: 'nearest'});
        setTimeout(() => newLi.style.backgroundColor = 'transparent', 1000);
    };

    // --- LOAD LOGIC ---
    async function loadComments() {
        commentList.innerHTML = '<li style="text-align:center; color:#666; padding:10px;">Loading comments...</li>';

        // Filter by Group AND (Fixed OR User)
        // We fetch all matching the group first
        const {data, error} = await _supabase
            .from('com2')
            .select('*')
            .eq('group_tag', CURRENT_GROUP) // Only this group
            .order('created_at', {ascending: true});

        if (error) {
            console.error('Error:', error);
            commentList.innerHTML = `<li style="color:red;">Error: ${error.message}</li>`;
            return;
        }

        commentList.innerHTML = '';
        if (!data || data.length === 0) {
            commentList.innerHTML = '<li style="text-align:center; color:#666; padding:10px;">No comments yet. Be the first!</li>';
            return;
        }

        // Filter visibility: Fixed OR Current User
        const visibleComments = data.filter(comment => {
            const commentUserId = comment.user_id || 'fixed';
            const isFixed = commentUserId === 'fixed';

            // The visitor's own comments are always visible (incl. their replies)
            if (!isFixed) return commentUserId === CURRENT_USER_ID;

            // Fixed comments:
            if (CURRENT_VARIANT === 'top') {
                // Only top-level fixed comments, no replies to fixed comments
                return (comment.reply_level || 0) === 0;
            }
            // 'full': show all fixed comments including replies
            return true;
        });
        if (visibleComments.length === 0) {
            commentList.innerHTML = '<li style="text-align:center; color:#666; padding:10px;">No comments yet.</li>';
            return;
        }

        // --- Build comment blocks (parent + its replies) ---
        const roots = visibleComments.filter(c => (c.reply_level || 0) === 0);
        const replies = visibleComments.filter(c => (c.reply_level || 0) > 0);

// Group replies under their parent id, sorted by time
        const repliesByParent = {};
        replies.forEach(r => {
            const pid = r.parent_id;
            if (!repliesByParent[pid]) repliesByParent[pid] = [];
            repliesByParent[pid].push(r);
        });
        Object.values(repliesByParent).forEach(list =>
            list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
        );

// Split top-level roots into fixed (to shuffle) and user (keep order)
        const fixedRoots = roots.filter(c => (c.user_id || 'fixed') === 'fixed');
        const userRoots = roots.filter(c => (c.user_id || 'fixed') !== 'fixed');

// Fisher-Yates shuffle of the fixed top-level comments
        for (let i = fixedRoots.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fixedRoots[i], fixedRoots[j]] = [fixedRoots[j], fixedRoots[i]];
        }

// Render order: shuffled fixed roots first, then user's own roots
        const orderedRoots = [...fixedRoots, ...userRoots];

// Helper to render a comment and all its descendants recursively
        function renderBlock(comment, isFixed) {
            const li = createCommentElement(comment, isFixed);
            commentList.appendChild(li);
            const children = repliesByParent[comment.id] || [];
            children.forEach(child => renderBlock(child, (child.user_id || 'fixed') === 'fixed'));
        }

        orderedRoots.forEach(root => {
            renderBlock(root, (root.user_id || 'fixed') === 'fixed');
        });

    }

    // --- POST LOGIC ---
    async function handlePost() {
        const text = commentInput.value.trim();
        const name = usernameInput.value.trim();

        if (!text) return alert("Write a comment.");
        if (!name) return alert("Enter your name.");

        saveUsername(name);
        postBtn.disabled = true;
        postBtn.textContent = '...';

        const newComment = {
            content: text,
            author: name,
            user_id: CURRENT_USER_ID,
            parent_id: null,
            reply_level: 0,
            group_tag: CURRENT_GROUP // IMPORTANT: Tag with current group
        };

        const {data, error} = await _supabase.from('com2').insert([newComment]).select();

        if (error) {
            alert('Failed: ' + error.message);
            postBtn.disabled = false;
            postBtn.textContent = 'Post';
            return;
        }

        const li = createCommentElement(data[0], false);
        commentList.appendChild(li);
        commentInput.value = '';
        commentList.scrollTop = commentList.scrollHeight;

        postBtn.disabled = false;
        postBtn.textContent = 'Post';
    }

    postBtn.addEventListener('click', handlePost);
    commentInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            handlePost();
        }
    });

    function escapeHtml(text) {
        if (!text) return "";
        const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>

</body>
</html>
