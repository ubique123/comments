<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Debate - Public Comments</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Load Configuration First -->
<script src="config.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #050505;
            --text-secondary: #65676b;
            --accent-blue: #1877f2;
            --border-color: #ced0d4;
            --hover-bg: #f2f2f2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ddd;
            background-image: url('https://ui-avatars.com/api/?name=Wege+Maniacy&background=random');
            background-size: cover;
        }

        .user-info h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-info span {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-caption {
            padding: 4px 16px 12px;
            font-size: 15px;
            color: var(--text-primary);
        }

        /* Image Section */
        .post-image {
            width: 100%;
            height: 300px;
            display: flex;
            position: relative;
            background-color: #000;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .panel.vegan {
            background-image: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
        }
        .panel.vegan::before {
            content: "🥗";
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .panel.meat {
            background-image: url('https://images.unsplash.com/photo-1600891964092-4316c288032e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
        }
        .panel.meat::before {
            content: "🥩";
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .panel.has-error::before { opacity: 1; }
        .panel.has-error { background: #333; opacity: 0.8; }

        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.8rem;
            z-index: 10;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Action Bar */
        .action-bar {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 0;
            width: 30%;
            border-radius: 4px;
        }
        .action-btn:hover { background-color: var(--hover-bg); }

        /* Comments */
        .comments-section { padding: 10px; background-color: #fff; }
        .comment-list {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .comment-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .comment-bubble {
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 18px;
            flex-grow: 1;
        }
        .comment-author {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 2px;
            display: block;
        }
        .comment-text {
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        /* Input Area - UPDATED */
        .input-area {
            border-top: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }

        .name-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .name-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            width: 60px;
        }

        #usernameInput {
            flex-grow: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-size: 14px;
            outline: none;
        }
        #usernameInput:focus { background-color: #fff; border-color: var(--accent-blue); }

        .comment-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-wrapper { flex-grow: 1; }
        
        #commentInput {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        #commentInput:focus { background-color: #fff; border-color: var(--accent-blue); }
        
        .post-btn {
            background: linear-gradient(to bottom, #1877f2, #166fe5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .post-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Options */
        .options-container { position: relative; }
        .options-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .options-menu {
            display: none;
            position: absolute;
            bottom: 40px;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            width: 260px;
            z-index: 100;
            overflow: hidden;
        }
        .options-menu.active { display: block; }
        .option-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
            line-height: 1.4;
        }
        .option-item:hover { background-color: var(--hover-bg); }
        .option-item:last-child { border-bottom: none; }
        
        .user-id-display {
            font-size: 10px;
            color: #999;
            text-align: right;
            padding: 0 16px 5px;
            font-family: monospace;
            display: none; /* Hidden by default now */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="post-header">
        <div class="avatar"></div>
        <div class="user-info">
            <h3>Wege-maniacy</h3>
            <span>2 hrs · <span style="font-size:10px">🌍</span></span>
        </div>
    </div>
    <div class="user-id-display" id="userIdDisplay"></div>

    <div class="post-caption">
        Komisja Europejska znów odrzuciła projekt delegalizacji reklam mięsa 😡 <br>
        Wnioski? Pomysły? Kampanie? Piszcie w komentarzach 👇
    </div>

    <div class="post-image">
        <div class="panel vegan" data-fallback-icon="🥗">VEGE</div>
        <div class="vs-badge">VS</div>
        <div class="panel meat" data-fallback-icon="🥩">MIĘSO</div>
    </div>


    <div class="comments-section">
        <ul class="comment-list" id="commentList">
            <!-- Comments injected via JS -->
        </ul>

        <!-- Updated Input Area -->
        <div class="input-area">
            <!-- Name Input -->
            <div class="name-input-row">
                <label class="name-label" for="usernameInput">Nick</label>
                <input type="text" id="usernameInput" placeholder="Wpisz swój nick">
            </div>
            
            <!-- Comment Input -->
            <div class="comment-input-row">
                <div class="input-wrapper">
                    <input type="text" id="commentInput" placeholder="Dodaj komentarz...">
                </div>
                <div class="options-container">
                    <button class="options-btn" id="optionsBtn">⚡Szybka odpowiedź</button>
                    <div class="options-menu" id="optionsMenu">
                        <div class="option-item" onclick="selectOption('I tried vegan for a month and loved it!')">🌱 Vegan for a month!</div>
                        <div class="option-item" onclick="selectOption('Meat is essential for a balanced diet.')">🥩 Meat is essential.</div>
                        <div class="option-item" onclick="selectOption('It depends on where you source your food.')">🤔 Depends on sourcing.</div>
                        <div class="option-item" onclick="selectOption('Can we agree processed junk is bad for everyone?')">🍔 Processed junk is bad.</div>
                    </div>
                </div>
                <button class="post-btn" id="postBtn">Opublikuj</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION LOADER ---
    // Check if config loaded, otherwise throw error
    if (typeof SUPABASE_CONFIG === 'undefined') {
        console.error("Error: config.js not found or SUPABASE_CONFIG not defined.");
        alert("Configuration error: Please ensure config.js exists and is loaded.");
    }

    const SUPABASE_URL = SUPABASE_CONFIG.url;
    const SUPABASE_KEY = SUPABASE_CONFIG.key;
    
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- USER ID & NAME LOGIC ---
    function getOrCreateUserId() {
        let userId = localStorage.getItem('diet_app_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            localStorage.setItem('diet_app_user_id', userId);
        }
        return userId;
    }

    function loadSavedUsername() {
        const savedName = localStorage.getItem('diet_app_username');
        if (savedName) {
            document.getElementById('usernameInput').value = savedName;
        }
    }

    function saveUsername(name) {
        localStorage.setItem('diet_app_username', name);
    }

    const CURRENT_USER_ID = getOrCreateUserId();
    
    document.addEventListener('DOMContentLoaded', () => {
        loadSavedUsername();
        loadComments();
    });

    // --- DOM ELEMENTS ---
    const usernameInput = document.getElementById('usernameInput');
    const commentInput = document.getElementById('commentInput');
    const postBtn = document.getElementById('postBtn');
    const commentList = document.getElementById('commentList');
    const optionsBtn = document.getElementById('optionsBtn');
    const optionsMenu = document.getElementById('optionsMenu');

    // --- IMAGE FALLBACK ---
    document.querySelectorAll('.panel').forEach(panel => {
        const bgUrl = getComputedStyle(panel).backgroundImage.slice(4, -1).replace(/"/g, "");
        const img = new Image();
        img.src = bgUrl;
        img.onerror = () => panel.classList.add('has-error');
    });

    // --- UI INTERACTIONS ---
    optionsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        optionsMenu.classList.toggle('active');
    });
    document.addEventListener('click', () => optionsMenu.classList.remove('active'));
    
    window.selectOption = function(text) {
        commentInput.value = text;
        optionsMenu.classList.remove('active');
        commentInput.focus();
    }

    // --- RENDER FUNCTION ---
    function createCommentElement(author, text, isFixed) {
        const li = document.createElement('li');
        li.className = 'comment-item';
        
        let displayName = author;
        if (!displayName || displayName.trim() === "") {
            displayName = isFixed ? "Anonymous User" : "Guest";
        }

        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=random`;

        li.innerHTML = `
            <img src="${avatarUrl}" class="comment-avatar" alt="${displayName}">
            <div class="comment-bubble">
                <span class="comment-author">${escapeHtml(displayName)}</span>
                <div class="comment-text">${escapeHtml(text)}</div>
            </div>
        `;
        return li;
    }

    // --- SUPABASE LOGIC ---
    async function loadComments() {
        commentList.innerHTML = '<li style="text-align:center; color:#666; padding:10px;">Loading comments...</li>';

        const { data, error } = await _supabase
            .from('com2')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) {
            console.error('Supabase Error:', error);
            commentList.innerHTML = `<li style="color:red; padding:10px;">Error: ${error.message}</li>`;
            return;
        }

        commentList.innerHTML = ''; 

        if (!data || data.length === 0) {
            commentList.innerHTML = '<li style="text-align:center; color:#666; padding:10px;">No comments yet. Be the first!</li>';
            return;
        }

        const visibleComments = data.filter(comment => {
            const commentUserId = comment.user_id || 'fixed';
            return commentUserId === 'fixed' || commentUserId === CURRENT_USER_ID;
        });

        if (visibleComments.length === 0) {
            commentList.innerHTML = '<li style="text-align:center; color:#666; padding:10px;">No comments yet. Be the first!</li>';
            return;
        }

        visibleComments.forEach(comment => {
            const isFixed = (comment.user_id === 'fixed');
            const authorName = comment.author || comment.name || comment.username || null;
            const finalName = isFixed ? authorName : authorName; 
            
            const li = createCommentElement(finalName, comment.content, isFixed);
            commentList.appendChild(li);
        });
        
        commentList.scrollTop = commentList.scrollHeight;
    }

    async function handlePost() {
        const text = commentInput.value.trim();
        const name = usernameInput.value.trim();

        if (!text) {
            alert("Please write a comment.");
            return;
        }
        if (!name) {
            alert("Please enter your name first.");
            usernameInput.focus();
            return;
        }

        saveUsername(name);

        postBtn.disabled = true;
        postBtn.textContent = '...';

        const newComment = {
            content: text,
            author: name,
            user_id: CURRENT_USER_ID
        };

        const { data, error } = await _supabase
            .from('com2')
            .insert([newComment])
            .select();

        if (error) {
            console.error('Error posting:', error);
            alert('Failed to post comment: ' + error.message);
            postBtn.disabled = false;
            postBtn.textContent = 'Post';
            return;
        }

        const li = createCommentElement(data[0].author, data[0].content, false);
        commentList.appendChild(li);
        commentInput.value = '';
        commentList.scrollTop = commentList.scrollHeight;
        
        postBtn.disabled = false;
        postBtn.textContent = 'Post';
    }

    postBtn.addEventListener('click', handlePost);
    commentInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handlePost();
    });

    function escapeHtml(text) {
        if (!text) return "";
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>
</body>
</html>
